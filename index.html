<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>Happy Birthday ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',cursive;
}

body{
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* 9:16 phone frame */
.app{
  width:100%;
  max-width:420px;
  aspect-ratio:9/16;
  position:relative;
  overflow:hidden;
  border-radius:25px;
  box-shadow:0 0 25px rgba(0,0,0,.5);
}

/* ===== pages ===== */
.page{
  position:absolute;
  width:100%;
  height:100%;
  left:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  color:white;
  transition:.5s ease;
  background-size:300% 300%;
  animation:gradient 8s ease infinite;
}

.page.active{ left:0; }

@keyframes gradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* gradients */
.g1{background:linear-gradient(45deg,#ff9a9e,#fad0c4);}
.g2{background:linear-gradient(45deg,#a18cd1,#fbc2eb);}
.g3{background:linear-gradient(45deg,#ff758c,#ff7eb3);}
.g4{background:linear-gradient(45deg,#89f7fe,#66a6ff);}
.g5{background:linear-gradient(45deg,#fddb92,#fbc2eb);}

/* text */
h1{
  font-size:2.2rem;
  margin-bottom:15px;
  animation:fadeUp 1s ease;
}

p{
  font-size:1.1rem;
  margin-bottom:25px;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1}
}

/* button */
button{
  padding:12px 28px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  background:white;
  color:#ff4d88;
  cursor:pointer;
  z-index:5;
}

/* ===== LIGHT HEARTS ===== */
.heart{
  position:absolute;
  font-size:18px;
  opacity:.9;
  animation:float 6s linear forwards;
  pointer-events:none; /* IMPORTANT FIX */
}

@keyframes float{
  from{transform:translateY(110%);opacity:0}
  30%{opacity:1}
  to{transform:translateY(-20%);opacity:0}
}

/* ===== cake ===== */
.cake{margin-top:20px}
.layer{width:170px;height:40px;background:#ff9ecb;margin:6px auto;border-radius:10px}
.candle{width:10px;height:40px;background:white;margin:auto;position:relative}

.flame{
  width:14px;height:18px;background:orange;border-radius:50%;
  position:absolute;top:-18px;left:-2px;
  animation:flicker .2s infinite alternate;
}
@keyframes flicker{from{transform:scale(1)}to{transform:scale(1.25)}}

.confetti{
  position:absolute;
  width:6px;height:6px;
  animation:fall 2.5s linear forwards;
}
@keyframes fall{
  to{transform:translateY(100vh) rotate(360deg)}
}
</style>
</head>

<body>

<div class="app">

<!-- 4 cute pages -->
<div class="page g1 active">
<h1>Happy Birthday ❤️</h1>
<p>You make my world brighter every day.</p>
<button onclick="next()">Next ➜</button>
</div>

<div class="page g2">
<h1>My Sunshine ☀️</h1>
<p>Your smile is my favorite thing.</p>
<button onclick="next()">Next ➜</button>
</div>

<div class="page g3">
<h1>My Favorite Person 💕</h1>
<p>Every moment with you is special.</p>
<button onclick="next()">Next ➜</button>
</div>

<div class="page g4">
<h1>Forever Us 🌹</h1>
<p>I promise to love you forever.</p>
<button onclick="next()">Next ➜</button>
</div>

<!-- last page -->
<div class="page g5" id="lastPage">
<h1>Make a Wish 🎂</h1>

<div class="cake">
  <div class="candle"><div class="flame" id="flame"></div></div>
  <div class="layer"></div>
  <div class="layer"></div>
  <div class="layer"></div>
</div>

<p>Tap cake to blow candle 💨</p>
<h2 id="wish"></h2>
</div>

</div>

<script>
let current=0;
const pages=document.querySelectorAll(".page");

/* next page */
function next(){
  pages[current].classList.remove("active");
  current++;
  pages[current].classList.add("active");
}

/* LIGHT hearts only pages 1-4 */
setInterval(()=>{
  if(current===4) return;

  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"%";
  pages[current].appendChild(h);
  setTimeout(()=>h.remove(),6000);
},900);

/* candle */
const last=document.getElementById("lastPage");

last.addEventListener("click",()=>{
  document.getElementById("flame").style.display="none";
  document.getElementById("wish").innerHTML="Happy Birthday My Love ❤️🎉";

  for(let i=0;i<50;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=`hsl(${Math.random()*360},80%,60%)`;
    last.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
});

/* swipe */
let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
  if(e.changedTouches[0].clientX<startX-40) next();
});
</script>

</body>
</html>
